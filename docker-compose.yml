# Loci Brain —— 起法：cp .env.example .env，填好，然后 docker compose up -d
#
# 记忆全在 ./buckets 里（宿主机上，你自己的盘）。容器只是个跑代码的壳，
# 删了重建不会丢东西。

services:
  loci-brain:
    image: loci-brain:latest
    # 🔴 2026-08-20 默认打开 build：**没有这一行，别人 clone 下来第一步就死。**
    #    `loci-brain:latest` 这个镜像只存在于我们自己机器上（我们自己 build 的），
    #    公开 registry 上没有 —— 别人照 README 跑 `docker compose up -d`
    #    只会得到一句「找不到镜像」，然后就没有然后了。
    #    有了这行：本地没有就现 build，build 完照样 tag 成 loci-brain:latest。
    build: .
    container_name: loci-brain
    restart: unless-stopped
    ports:
      # 🔴 默认只开在本机。要让局域网/公网够得到，自己改成 "18002:8000" ——
      #    但先想清楚：这个服务**没有鉴权**，开出去等于把记忆摊在路边。
      - "127.0.0.1:18002:8000"
    env_file:
      - .env
    environment:
      - LOCI_CONFIG_PATH=/app/buckets/config.yaml
      - LOCI_TRANSPORT=streamable-http
      - LOCI_MCP_REQUIRE_AUTH=false
    volumes:
      - ./buckets:/app/buckets
    depends_on:
      - ollama

  # 本地向量模型。已经有自己的 embedding 服务就把这块删掉，
  # 把 .env 里的 LOCI_EMBED_BASE_URL 指过去就行。
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  # 🔴 把模型拉下来，跑一次就退出。
  #    没有这一块的话，空白机上会出现这个形状：**compose 起来了、容器全绿、
  #    面板上「向量」那一行也是绿的 —— 而第一次真写记忆的时候才炸**，
  #    因为 ollama 起来了但里面一个模型都没有。
  #    失败来得太晚，而且是挂在你当时正在做的事情上，不是挂在配置上。
  #    （另一半在面板里：设置屏现在会真去要一个向量，而不是只看你填没填。）
  #
  #    模型已经在卷里的话，pull 会很快返回，所以每次 up 都跑一遍不花什么。
  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull-model
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[init] 等 ollama 起来…"
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "[init] 拉 bge-m3（第一次要几分钟，之后是秒回）"
        ollama pull bge-m3
        echo "[init] 好了。"
    restart: "no"

volumes:
  ollama-models:
