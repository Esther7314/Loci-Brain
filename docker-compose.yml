# Loci Brain —— 起法：docker compose up -d（要改时区之类的，先 cp .env.example .env 再改）
#
# 一个容器里跑 Loci 和它的网关（package/launcher.py 一起起、一起守，哪个挂了拉哪个）。
# 记忆在 ./buckets，钥匙和网关自己的账在 ./data（都在宿主机上，你自己的盘）。
# 容器只是个跑代码的壳，删了重建不会丢东西。
#
# 要本地向量模型（ollama + bge-m3）：docker compose --profile ollama up -d
# 不加 --profile 就不起 ollama，向量模型在面板 setting 页里配云端的。

services:
  loci-brain:
    image: loci-brain:latest
    # 🔴 2026-08-20 默认打开 build：**没有这一行，别人 clone 下来第一步就死。**
    #    `loci-brain:latest` 这个镜像只存在于我们自己机器上（我们自己 build 的），
    #    公开 registry 上没有 —— 别人照 README 跑 `docker compose up -d`
    #    只会得到一句「找不到镜像」，然后就没有然后了。
    #    有了这行：本地没有就现 build，build 完照样 tag 成 loci-brain:latest。
    build:
      context: .
      args:
        # 国内服务器 pip 慢：在 .env 里写 LOCI_PIP_INDEX=<镜像地址>，见 .env.example
        LOCI_PIP_INDEX: ${LOCI_PIP_INDEX:-}
    container_name: loci-brain
    restart: unless-stopped
    ports:
      # 🔴 默认只开在本机（LOCI_PUBLISH 缺省 127.0.0.1）。云服务器上要让手机够得到，
      #    在 .env 里写 LOCI_PUBLISH=0.0.0.0，别改这个文件 —— 改了它，以后 git pull 会卡住。
      #    先在面板上设好密码。网关的每条路径都要带口令，MCP 要带钥匙（面板 setting 页
      #    「连接地址」那一块抄），但面板本身只靠那个密码挡着。
      - "${LOCI_PUBLISH:-127.0.0.1}:18002:18002"   # Loci：面板 /loci、MCP /mcp
      - "${LOCI_PUBLISH:-127.0.0.1}:3100:3100"     # 网关：/<口令>/v1
    env_file:
      - path: .env        # 选填：时区、名字这些，见 .env.example
        required: false
    environment:
      - LOCI_MCP_REQUIRE_AUTH=false
    volumes:
      - ./buckets:/app/buckets
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_started
        required: false

  # 本地向量模型，只在 --profile ollama 时起。面板「向量模型」选本地、地址填
  # http://ollama:11434/v1，模型 bge-m3。
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  # 🔴 把模型拉下来，跑一次就退出。
  #    没有这一块的话，空白机上会出现这个形状：**compose 起来了、容器全绿、
  #    面板上「向量」那一行也是绿的 —— 而第一次真写记忆的时候才炸**，
  #    因为 ollama 起来了但里面一个模型都没有。
  #    失败来得太晚，而且是挂在你当时正在做的事情上，不是挂在配置上。
  #    （另一半在面板里：设置屏现在会真去要一个向量，而不是只看你填没填。）
  #
  #    模型已经在卷里的话，pull 会很快返回，所以每次 up 都跑一遍不花什么。
  ollama-pull-model:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    container_name: ollama-pull-model
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[init] 等 ollama 起来…"
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "[init] 拉 bge-m3（第一次要几分钟，之后是秒回）"
        ollama pull bge-m3
        echo "[init] 好了。"
    restart: "no"

volumes:
  ollama-models:
