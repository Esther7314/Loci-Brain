# ============================================================
# Alias table — used to normalise subjects. Maintained by hand, never by a model.
# ============================================================
#
# 🔴 To use it: copy this into your DATA VOLUME and rename it to aliases.yaml:
#        cp config/aliases.example.yaml buckets/aliases.yaml
#    It lives in the data volume rather than in the code on purpose — the table holds
#    the names of real people, which is your data, and it must not ship inside an image.
#    LOCI_ALIAS_TABLE can point it somewhere else.
#
# Why this is a gate and not a convention:
#   Without normalisation, "Mike" and "Michael" become two different subjects and
#   retrieval breaks on the spot. A rule that depends on everyone remembering to write
#   the same word every time is not a rule.
#
# How it works: the tagging model pulls subjects out of the text → each one is run
# through this table → anything matching an alias is replaced by the canonical name.
#   canonical name (key)  the word that lands in `subjects` in the frontmatter
#   aliases (values)      the ways it might actually appear in the text (case-insensitive)
#
# ⚠️ People only. Places do not belong here — those go through tags.
# ⚠️ Once a canonical name is set, do not change it. Changing it orphans every `subjects`
#    entry already written to disk, and this table has no migration script. Decide who is
#    going to rewrite the stored data before you touch it.
# ⚠️ Pronouns never go in this table. A pronoun is not a name, and there is a separate
#    gate that keeps them out.
#
# 📌 Use whatever you actually call someone, not what is on their passport — `subjects`
#    exists to be searched, not to be official.
#
# If the table is missing or malformed, the behaviour is "no normalisation", NOT "nothing
# is saved": the subjects that were extracted are still stored, they are just not merged
# into one person this time. Losing the merge is much cheaper than losing the subject.

# ——— write it in this shape ———
# Michael Chen:
#   - Mike
#   - MC
#
# Sarah:
#   - Sarah J
#   - "SJ"
