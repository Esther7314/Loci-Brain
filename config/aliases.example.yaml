# ============================================================
# 别名表 —— 主体（subjects）归一用。**手工维护，不给模型写。**
# ============================================================
#
# 🔴 用法：把这份复制到你的**数据卷**里，改名成 aliases.yaml：
#        cp config/aliases.example.yaml buckets/aliases.yaml
#    它放在数据卷而不是代码里，是故意的 —— 表里是**活人的名字**，
#    那属于你的数据，不该跟着镜像一起被发布出去。
#    也可以用 LOCI_ALIAS_TABLE 指到别处。
#
# 为什么它是**闸不是约定**：
#   不做归一的话，「她哥」和「哥哥」会分裂成两个主体，检索当场断掉。
#   一个靠「大家都记得写同一个词」维持的规则，等于没有规则。
#
# 怎么用：打标模型从正文里抽出主体 → 逐个过这张表 → 命中别名就换成左边的规范名。
#   规范名（key）= 落进 frontmatter 的 subjects 里的那个词
#   别名（value）= 正文里可能出现的各种写法（大小写不敏感）
#
# ⚠️ 只写**人**。地点不在这儿（地点走 tags）。
# ⚠️ 规范名一旦定下就别改：改了等于把已经落盘的 subjects 全变成孤儿，
#    而这张表没有迁移脚本。要改先想清楚谁来改盘。
# ⚠️ 代词（她/他/我…）永远不进这张表 —— 指代不是名字。系统另有一道闸挡它们。
#
# 📌 规范名用**你平时怎么称呼他**，不用身份证上的写法 ——
#    subjects 是给检索用的，不是户口本。
#
# 表读不到 / 写坏了，行为是「不归一」，不是「不落盘」：
# 抽到的主体照样存，只是这次没并成一个人。丢归一比丢主体轻。

