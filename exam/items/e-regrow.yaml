# Paper section 戊: regrow as a supplement vs a correction.
# 1.4.0's regrow takes no "supplement / correction" argument and never touches
# descendants. The checks below read the marks the next version has to show
# (「待复核」 on a descendant whose basis was corrected) from recall's own output.

- id: E1
  title: "a supplement leaves descendants alone"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e10001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
    - id: e10002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e10001000000]
  steps:
    - snapshot: e10002000000
      as: child_before
    - call: regrow
      args: {bucket_id: e10001000000, text: "周六和她去爬山，爬到一半下雨了，她说淋雨也挺开心。", v: 0.7, a: 0.5}
    - newest: e10001000000
      as: new
    - check: {segment: store, desc: "the source has a new version", field: supersedes, id: $new, equals: e10001000000}
    - check: {segment: find, desc: "the old version is still readable by id", field: superseded_by, id: e10001000000, equals: $new}
    - check: {segment: think, desc: "the descendant is untouched", unchanged: e10002000000, since: child_before, keys: [last_active, status, from, tags]}
    - call: recall
      args: {query: e10002000000}
      as: child
    - check: {segment: find, desc: "the descendant is not marked for review", output: child, lacks: 待复核}

- id: E2
  title: "a correction cards the descendant and marks it for review"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e20001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
    - id: e20002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e20001000000]
  steps:
    - call: regrow
      args: {bucket_id: e20001000000, text: "记错了：那天没去成，是在家看了一天电影。", v: 0.5, a: 0.3}
    - call: recall
      args: {query: e20002000000}
      as: child
    - check: {segment: find, desc: "read by id: the descendant carries 待复核", output: child, contains: 待复核}
    - call: breath
    - check: {segment: think, desc: "the model got a card about the corrected basis", output: breath, contains: e20002}

- id: E3
  title: "regrow without saying supplement or correction is refused"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e30001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
  steps:
    - call: regrow
      args: {bucket_id: e30001000000, text: "周六和她去爬山，下了雨。", v: 0.6, a: 0.4}
    - newest: e30001000000
      as: new
    - check: {segment: store, desc: "nothing was written", var: new, equals: e30001000000}

- id: E4
  title: "a source that cannot be reached right now: keep, mark unverifiable"
  interface: none
  needs: "sources that can report 'temporarily unavailable'; an 'unverifiable' mark"

- id: E5
  title: "a correction marks every descendant at once, cards them one layer at a time"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e50001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
    - id: e50002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e50001000000]
    - id: e50003000000
      at: "2026-09-29T09:00:00+08:00"
      room: MIND/VIEWS
      text: "周末约她出门，不用等她先开口。"
      from: [e50002000000]
  steps:
    - call: regrow
      args: {bucket_id: e50001000000, text: "记错了：那天没去成，在家看电影。", v: 0.5, a: 0.3}
    - call: recall
      args: {query: e50002000000}
      as: child
    - call: recall
      args: {query: e50003000000}
      as: grandchild
    - check: {segment: find, desc: "stop trusting at once: the child is marked", output: child, contains: 待复核}
    - check: {segment: find, desc: "stop trusting at once: the grandchild is marked too", output: grandchild, contains: 待复核}
    - call: breath
    - check: {segment: think, desc: "layer by layer: the child gets the card first", output: breath, contains: e50002}
    - check: {segment: think, desc: "layer by layer: no card for the grandchild yet", output: breath, lacks: e50003}

- id: E6
  title: "fixing a typo keeps no version and cards nobody"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e60001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬出。"
    - id: e60002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e60001000000]
  steps:
    - snapshot: e60002000000
      as: child_before
    - call: trace
      args: {bucket_id: e60001000000, old_str: "爬出", new_str: "爬山"}
    - check: {segment: store, desc: "the typo is fixed", body_contains: "爬山", id: e60001000000}
    - newest: e60001000000
      as: new
    - check: {segment: store, desc: "no new version", var: new, equals: e60001000000}
    - check: {segment: think, desc: "the descendant is untouched", unchanged: e60002000000, since: child_before, keys: [last_active, status, tags]}
