# Paper section 戊: regrow as a supplement vs an overturn.
# regrow takes mode="supplement" | "overturn" and refuses without it. An overturn
# appends an `invalidation` record to every descendant, layer by layer; recall's read by
# id shows it as 「依据变了」. breath's 「依据变了的」 block cards them one layer at a time:
# a descendant comes up once what it stands on has been dealt with.

- id: E1
  title: "a supplement leaves descendants alone"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e10001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
    - id: e10002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e10001000000]
  steps:
    - snapshot: e10002000000
      as: child_before
    - call: regrow
      args: {bucket_id: e10001000000, mode: supplement, text: "周六和她去爬山，爬到一半下雨了，她说淋雨也挺开心。", v: 0.7, a: 0.5}
    - newest: e10001000000
      as: new
    - check: {segment: store, desc: "the source has a new version", field: supersedes, id: $new, equals: e10001000000}
    - check: {segment: find, desc: "the old version is still readable by id", field: superseded_by, id: e10001000000, equals: $new}
    - check: {segment: think, desc: "the descendant is untouched", unchanged: e10002000000, since: child_before, keys: [last_active, status, from, tags]}
    - call: recall
      args: {query: e10002000000}
      as: child
    - check: {segment: find, desc: "the descendant is not marked", output: child, lacks: 依据变了}

- id: E2
  title: "a correction cards the descendant and marks it for review"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e20001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
    - id: e20002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e20001000000]
  steps:
    - call: regrow
      args: {bucket_id: e20001000000, mode: overturn, text: "记错了：那天没去成，是在家看了一天电影。", v: 0.5, a: 0.3}
    - call: recall
      args: {query: e20002000000}
      as: child
    - check: {segment: find, desc: "read by id: the descendant carries 依据变了", output: child, contains: 依据变了}
    - call: breath
    - check: {segment: think, desc: "the model got a card about the overturned basis", output: breath, section: 依据变了的, contains: e20002}

- id: E3
  title: "regrow without saying supplement or overturn is refused"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e30001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
  steps:
    - call: regrow
      args: {bucket_id: e30001000000, text: "周六和她去爬山，下了雨。", v: 0.6, a: 0.4}
    - newest: e30001000000
      as: new
    - check: {segment: store, desc: "nothing was written", var: new, equals: e30001000000}

- id: E4
  title: "a source that cannot be reached right now: keep, mark unverifiable"
  interface: none
  needs: "sources that can report 'temporarily unavailable'; an 'unverifiable' mark"

- id: E5
  title: "a correction marks every descendant at once, cards them one layer at a time"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e50001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山。"
    - id: e50002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e50001000000]
    - id: e50003000000
      at: "2026-09-29T09:00:00+08:00"
      room: MIND/VIEWS
      text: "周末约她出门，不用等她先开口。"
      from: [e50002000000]
  steps:
    - call: regrow
      args: {bucket_id: e50001000000, mode: overturn, text: "记错了：那天没去成，在家看电影。", v: 0.5, a: 0.3}
    - call: recall
      args: {query: e50002000000}
      as: child
    - call: recall
      args: {query: e50003000000}
      as: grandchild
    - check: {segment: find, desc: "stop trusting at once: the child is marked", output: child, contains: 依据变了}
    - check: {segment: find, desc: "stop trusting at once: the grandchild is marked too", output: grandchild, contains: 依据变了}
    - call: breath
    - check: {segment: think, desc: "layer by layer: the child gets the card first", output: breath, section: 依据变了的, contains: e50002}
    - check: {segment: think, desc: "layer by layer: no card for the grandchild yet", output: breath, section: 依据变了的, lacks: e50003}

- id: E6
  title: "fixing a typo keeps no version and cards nobody"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: e60001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬出。"
    - id: e60002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [e60001000000]
  steps:
    - snapshot: e60002000000
      as: child_before
    - call: trace
      args: {bucket_id: e60001000000, old_str: "爬出", new_str: "爬山"}
    - check: {segment: store, desc: "the typo is fixed", body_contains: "爬山", id: e60001000000}
    - newest: e60001000000
      as: new
    - check: {segment: store, desc: "no new version", var: new, equals: e60001000000}
    - check: {segment: think, desc: "the descendant is untouched", unchanged: e60002000000, since: child_before, keys: [last_active, status, tags]}

# A run of lines is one source record; the host revises one line in its middle. The memory
# is carded naming that line and its revision, confirmed per line and revision.
- id: E7
  title: "a line revised inside a run cards the memory, once per revision"
  start: "2026-10-01T10:00:00+08:00"
  hosts:
    legacy: {token: t-life, scope_mode: open, may_restore: true}
  setup:
    - id: e70001000000
      at: "2026-09-30T21:00:00+08:00"
      room: EVENT/WORLD
      text: "小周和我商量周日去郊游，定了早上八点在地铁站碰头。"
      sources: [{system: lento, instance: home, container: "private:U", id: m_20260930_0002, through: m_20260930_0005}]
  slices:
    source: {system: lento, instance: home, container: "private:U"}
    day: "2026-09-30"
    lines:
      - {id: m_20260930_0001, speaker: 我, text: "周日有空吗？"}
      - {id: m_20260930_0002, speaker: 小周, text: "有，想出去走走。"}
      - {id: m_20260930_0003, speaker: 我, text: "那去郊游，早上八点？"}
      - {id: m_20260930_0004, speaker: 小周, text: "好，地铁站碰头。"}
      - {id: m_20260930_0005, speaker: 我, text: "就这么定了。"}
      - {id: m_20260930_0006, speaker: 小周, text: "晚安。"}
    cut:
      - {from: 2, to: 5, gist: "约周日早上八点郊游"}
  steps:
    - source_change: {change_id: c-e7-1, host_seq: 1, change: revised, revision: "2",
                      source: "lento:home/private:U#m_20260930_0003"}
      host: t-life
    - call: breath
      as: first
    - check: {segment: think, desc: "the memory is carded", output: first, section: 依据变了的, contains: e70001}
    - check: {segment: think, desc: "naming the line inside the run that was revised", output: first, section: 依据变了的, contains: "m_20260930_0003 出了新版本（2"}
    - call: trace
      args: {bucket_id: e70001000000, invalidation: confirmed}
    - call: breath
      as: confirmed
    - check: {segment: think, desc: "confirmed at that revision: gone", output: confirmed, section: 依据变了的, lacks: e70001}
    - source_change: {change_id: c-e7-2, host_seq: 2, change: revised, revision: "3",
                      source: "lento:home/private:U#m_20260930_0003"}
      host: t-life
    - call: breath
      as: again
    - check: {segment: think, desc: "a later revision of the same line cards it again", output: again, section: 依据变了的, contains: "m_20260930_0003 出了新版本（3"}
    - call: trace
      args: {bucket_id: e70001000000, invalidation: confirmed}
    - source_change: {change_id: c-e7-3, host_seq: 1, change: revised, revision: "2",
                      source: "lento:home/private:U#m_20260930_0006"}
      host: t-life
    - call: breath
      as: outside
    - check: {segment: think, desc: "a line outside the run does not card it", output: outside, section: 依据变了的, lacks: e70001}
