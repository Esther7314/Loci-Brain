# Paper section 乙 (ahead, the first slice). B4 lives in its own file.
# A future item is something wanted: direction_of_fit telic, with an optional `when`.
# Where the paper asks for something 1.4.0 has no way to express (promised or not,
# awake or asleep, cards), the item says so with `interface: none`.

- id: B1
  title: "a light interest sleeps, is not nagged, and search does not wake it"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: b10001000000
      at: "2026-10-01T10:00:00+08:00"
      room: EVENT/SELF
      text: "有空想看看《夜航西飞》。"
      fields: {direction_of_fit: telic, weight: 0.3}
  steps:
    - at: "2026-10-04T10:00:00+08:00"
    - call: breath
      as: day3
    - check: {segment: think, desc: "day 3: not on the list (no date)", output: day3, section: 惦记的事, lacks: b10001}
    - check: {segment: think, desc: "day 3: not on the list as hanging either (light, not promised)", output: day3, section: 惦记的事, lacks: b10001}
    - at: "2026-10-31T10:00:00+08:00"
    - call: breath
      as: day30
    - check: {segment: think, desc: "day 30: asleep, in no breath block", output: day30, lacks: b10001}
    - snapshot: b10001000000
      as: before_search
    - call: recall
      args: {query: 夜航西飞}
    - check: {segment: find, desc: "search finds it", output: recall, contains: b10001}
    - check: {segment: think, desc: "being found does not warm it", unchanged: b10001000000, since: before_search, keys: [last_active, activation_count, status, weight]}
    - call: breath
      as: after_search
    - check: {segment: think, desc: "after search: still asleep", output: after_search, lacks: b10001}
    - check: {segment: store, desc: "still wanted", field: direction_of_fit, id: b10001000000, equals: telic}
    - check: {segment: store, desc: "never closed by itself", field: status, id: b10001000000, absent: true}

- id: B2
  title: "a promise for tonight: quiet in the day, back at the next chance, gone once done"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: b20001000000
      at: "2026-10-01T10:00:00+08:00"
      room: EVENT/SELF
      text: "答应今晚回来告诉她面试结果。"
      # 今晚, as core/_dates resolves it: a part of the day with no hour is 19:00.
      when: "2026-10-01T19:00+08:00"
      fields: {direction_of_fit: telic, weight: 0.8}
  steps:
    - check: {segment: store, desc: "the time is on disk", field: when, id: b20001000000, equals: "2026-10-01T19:00+08:00"}
    # A window already open in the morning (it asked for cards with its first message).
    - cue: {text: "早上好", window: day, turn: t1}
    - at: "2026-10-01T14:00:00+08:00"
    - call: breath
      as: afternoon
    - check: {segment: think, desc: "14:00: awake but not in breath yet", output: afternoon, lacks: b20001}
    - cue: {text: "下午好", window: day, turn: t2}
      as: afternoon_card
    - check: {segment: input, desc: "14:00: no card in the open window either", output: afternoon_card, lacks: b20001}
    - at: "2026-10-01T19:10:00+08:00"
    # The window open since the morning: the next message brings it, whatever it says.
    - cue: {text: "回来了", window: day, turn: t3}
      as: due_card
    - check: {segment: input, desc: "19:10, the open window: a time-is-up card with the next message", output: due_card, contains: b20001}
    - check: {segment: input, desc: "and it says the time has come", output: due_card, contains: 【提醒】}
    - cue_delivered: {window: day, turn: t3}
    - cue: {text: "嗯嗯", window: day, turn: t4}
      as: due_again
    - check: {segment: input, desc: "delivered is not done, and not sent twice to the window", output: due_again, lacks: b20001}
    - check: {segment: store, desc: "delivered is not done: the promise is still open", field: status, id: b20001000000, absent: true}
    # A window opened now reads it in breath, not as a card.
    - cue: {text: "回来了", window: night, turn: t1}
      as: new_window
    - check: {segment: input, desc: "a new window: no card (its breath lists it)", output: new_window, lacks: b20001}
    - call: breath
      as: evening
    - check: {segment: think, desc: "19:10: in breath with a reason", output: evening, section: 惦记的事, contains: b20001}
    - call: trace
      args: {bucket_id: b20001000000, status: resolved}
    - at: "2026-10-01T19:20:00+08:00"
    - call: breath
      as: after
    - check: {segment: think, desc: "19:20: closed, gone from the list", output: after, section: 惦记的事, lacks: b20001}
    - check: {segment: think, desc: "19:20: closed, not hanging there either", output: after, section: 惦记的事, lacks: b20001}

- id: B3
  title: "rescheduling in the same window sends the card again"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: b30001000000
      at: "2026-10-01T10:00:00+08:00"
      room: EVENT/SELF
      text: "答应今晚回来告诉她面试结果。"
      when: "2026-10-01T19:00+08:00"
      fields: {direction_of_fit: telic, weight: 0.8, bound: [AI],
               cue: {condition: "面试结果出来", phrasings: ["面试"]}}
  steps:
    - at: "2026-10-01T10:30:00+08:00"
    - cue: {text: "面试是今天下午", window: w1, turn: t1}
      as: first
    - check: {segment: input, desc: "before the change: a card", output: first, contains: b30001}
    - cue_delivered: {window: w1, turn: t1}
    - snapshot: b30001000000
      as: before
    # 「今晚我有事，明天中午再说吧」: the model moves the day (trace takes a day for a want).
    - call: trace
      args: {bucket_id: b30001000000, when: "2026-10-02"}
    - check: {segment: store, desc: "the time is tomorrow", field: when, id: b30001000000, equals: "2026-10-02"}
    - check: {segment: store, desc: "still promised and open", unchanged: b30001000000, since: before, keys: [bound, status, direction_of_fit]}
    - cue: {text: "面试的事明天说", window: w1, turn: t2}
      as: second
    - check: {segment: input, desc: "the version moved: the same window gets the card again", output: second, contains: b30001}
    - check: {segment: input, desc: "with the new day on it", output: second, contains: "时间 10-02"}

- id: B5
  title: "'never mind, not doing it' really closes it"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: b50001000000
      at: "2026-09-20T10:00:00+08:00"
      room: EVENT/SELF
      text: "有空想看看《夜航西飞》。"
      fields: {direction_of_fit: telic, weight: 0.5}
  steps:
    - call: trace
      args: {bucket_id: b50001000000, status: abandoned}
    - check: {segment: store, desc: "closed as abandoned, not as done", field: status, id: b50001000000, equals: abandoned}
    - call: breath
    - check: {segment: think, desc: "not hanging on the list any more", output: breath, section: 惦记的事, lacks: b50001}
    - check: {segment: think, desc: "not on the list with a date either", output: breath, section: 惦记的事, lacks: b50001}
    - call: recall
      args: {query: 夜航西飞}
    - check: {segment: find, desc: "search still finds it", output: recall, contains: b50001}

- id: B6
  title: "a negated mention sends a card but changes nothing"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: b60001000000
      at: "2026-09-25T10:00:00+08:00"
      room: EVENT/SELF
      text: "考完试一起去吃那家甜品。"
      fields: {direction_of_fit: telic, weight: 0.6, bound: [AI],
               cue: {condition: "考完试", phrasings: ["考完", "考完试"]}}
  steps:
    - snapshot: b60001000000
      as: before
    - cue: {text: "还没考完呢，烦死了", window: w1, turn: t1}
      as: card
    - check: {segment: think, desc: "「考完」 matched: a card", output: card, contains: b60001}
    - check: {segment: think, desc: "the card quotes the clause and says it is negated", output: card, contains: 否定}
    - cue_delivered: {window: w1, turn: t1}
    - check: {segment: store, desc: "code changed nothing on the entry", unchanged: b60001000000, since: before, keys: [status, when, bound, cue, weight, last_active, activation_count]}

- id: B7
  title: "searching a sleeping item does not warm it"
  start: "2026-11-01T10:00:00+08:00"
  setup:
    - id: b70001000000
      at: "2026-09-01T10:00:00+08:00"
      room: EVENT/SELF
      text: "想学做酸面包。"
      fields: {direction_of_fit: telic, weight: 0.2}
  steps:
    - snapshot: b70001000000
      as: before
    - call: recall
      args: {query: 面包}
    - check: {segment: find, desc: "search finds it", output: recall, contains: b70001}
    - check: {segment: think, desc: "state and heat unchanged by the search", unchanged: b70001000000, since: before, keys: [last_active, activation_count, status, weight, decay_stage]}
    - call: breath
    - check: {segment: think, desc: "next breath: still not shown", output: breath, lacks: b70001}

- id: B9
  title: "promised without a time: in breath, asking for a time or condition"
  start: "2026-10-05T10:00:00+08:00"
  setup:
    - id: b90001000000
      at: "2026-10-01T10:00:00+08:00"
      room: EVENT/SELF
      text: "答应帮她把旧照片按年份理一下。"
      # Promised = someone is bound by it (v2 `bound`); without it this is a wish, asleep.
      fields: {direction_of_fit: telic, weight: 0.7, bound: [AI]}
  steps:
    - call: breath
    - check: {segment: think, desc: "shows up in breath", output: breath, section: 惦记的事, contains: b90001}
    - check: {segment: think, desc: "the reason is 'promised but no time'", output: breath, contains: 没定时间}
    - check: {segment: think, desc: "it asks for a time or condition", output: breath, contains: 定个时间}

- id: B10
  title: "promised items do not sink; light ones do"
  interface: none
  needs: "awake/asleep computed per entry (is_accessible, stage 5); promised = telic with bound is stored and immune to decay since stage 2"

- id: B11
  title: "still there after a window change"
  interface: none
  needs: "a window id from the host. Loci keeps nothing per window, so on the tool layer this is B2; the whole-turn layer checks the new window's first turn"

- id: B12
  title: "promises rise in recall only among results that match"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: b12001000000
      at: "2026-09-28T10:00:00+08:00"
      room: EVENT/SELF
      text: "答应周末陪她去看牙。"
      when: "2026-10-04"
      fields: {direction_of_fit: telic, weight: 0.8}
    - id: b12002000000
      at: "2026-09-20T10:00:00+08:00"
      room: EVENT/WORLD
      text: "她在读一本讲航海的书，说很好看。"
    - id: b12003000000
      at: "2026-09-22T10:00:00+08:00"
      room: EVENT/SELF
      text: "我给她推荐了两本书。"
    - id: b12004000000
      at: "2026-09-25T10:00:00+08:00"
      room: EVENT/WORLD
      text: "她说书架快放不下了。"
  steps:
    - call: recall
      args: {query: 书}
      as: books
    - check: {segment: find, desc: "a search for books does not pull in the dentist promise", output: books, lacks: b12001}
    - call: recall
      args: {query: 周末}
      as: weekend
    - check: {segment: find, desc: "a search for the weekend finds it", output: weekend, contains: b12001}

- id: B13
  title: "a MIND question about the future can be closed as answered"
  interface: none
  needs: "MIND entries with tense ahead, and a close reason 'answered'"
