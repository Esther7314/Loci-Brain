    - check: {segment: store, desc: "no memory came of it", no_entry: {body_has: 湖边烧烤}}
    - source_lines: {source: {system: telegram, instance: bot-a, container: "group:G", id: "m_301", through: "m_304"}, lines: [m_301, m_302, m_303, m_304]}
