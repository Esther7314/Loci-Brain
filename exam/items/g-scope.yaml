# 庚1-7 hide the entry itself. G8-G10: an entry out of scope is not named on any side
# channel either — what a read by id mentions in passing, every kind of card, and what the
# write tools say back. One chat, two venues: `use: venues [group]` vs `[private]`, the
# group's scope granted the whole chat, so only the use decides.

- id: G8
  title: "a read by id names nothing out of scope in passing"
  start: "2026-10-01T10:00:00+08:00"
  hosts:
    legacy: {token: life-line-key, scope_mode: open}
    book-bot: {token: book-bot-key, max_grant: [{system: telegram, instance: bot-a}]}
  setup:
    - id: a08001000000
      at: "2026-09-30T20:00:00+08:00"
      room: EVENT/WORLD
      text: "读书会的场地周六借到了。"
      sources: [{system: telegram, instance: bot-a, container: "group:G", id: "m_801", use: {venues: [group]}}]
    - id: a08002000000
      at: "2026-09-30T20:05:00+08:00"
      room: EVENT/WORLD
      text: "她私下说周六的场地是她托人借的。"
      sources: [{system: telegram, instance: bot-a, container: "group:G", id: "m_802", use: {venues: [private]}}]
    - id: a08003000000
      at: "2026-09-30T20:10:00+08:00"
      room: EVENT/WORLD
      text: "周六读书会有场地了。"
      tags: ["疑似同件:a08001", "疑似同件:a08002"]
      sources: [{system: telegram, instance: bot-a, container: "group:G", id: "m_803", use: {venues: [group]}}]
    - id: a08004000000
      at: "2026-09-29T20:00:00+08:00"
      room: EVENT/WORLD
      text: "读书会原来定在周五晚上。"
      sources: [{system: telegram, instance: bot-a, container: "group:G", id: "m_804", use: {venues: [private]}}]
    - id: a08005000000
      at: "2026-09-30T21:00:00+08:00"
      room: EVENT/WORLD
      text: "读书会改到周六下午了。"
      sources: [{system: telegram, instance: bot-a, container: "group:G", id: "m_805", use: {venues: [group]}}]
      fields: {supersedes: a08004000000, prov: [{rel: wasRevisionOf, target: a08004000000}]}
  steps:
    - call: recall
      args: {query: a08003000000}
      host: book-bot-key
      scope: *group_scope
      as: tagged
    - check: {segment: find, desc: "the entry itself reads", output: tagged, contains: 有场地了}
    - check: {segment: find, desc: "a 疑似同件 tag naming what the group may read stays", output: tagged, contains: "疑似同件:a08001"}
    - check: {segment: find, desc: "one naming the private entry is not there", output: tagged, lacks: a08002}
    - call: recall
      args: {query: a08005000000}
      host: book-bot-key
      scope: *group_scope
      as: versioned
    - check: {segment: find, desc: "the new version reads", output: versioned, contains: 周六下午}
    - check: {segment: find, desc: "the version it replaced, private, is not named", output: versioned, lacks: a08004}
    - call: recall
      args: {query: a08005000000}
      host: life-line-key
      as: versioned_open
    - check: {segment: find, desc: "control: open, the replaced version is named", output: versioned_open, contains: a08004}

