# Paper section 己: archiving is light, deleting a source is heavy.
- id: F1
  title: "archiving a source leaves its descendants as they were"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: f10001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山，她一路都在笑。"
    - id: f10002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [f10001000000]
  steps:
    - call: trace
      args: {bucket_id: f10001000000, delete: true}
    - check: {segment: store, desc: "the source went to the archive", field: _path, id: f10001000000, contains: archive}
    - call: recall
      args: {query: 出门}
    - check: {segment: find, desc: "the descendant is still found", output: recall, contains: f10002}
    - call: recall
      args: {query: f10002000000}
      as: child
    - check: {segment: source, desc: "the descendant can still reach its source", output: child, contains: f10001}

# The host's signal arrives through POST /api/v2/source/change (the `source_change:` step
# runs what that route runs). Dream weaving is out of the tool layer's reach (H items):
# the dream record itself is checked in F4. The strong-reminder card for what stood on a
# withdrawn source is D12's.
- id: F2
  title: "a deleted source stops its descendants on every road"
  start: "2026-10-01T10:00:00+08:00"
  hosts:
    legacy: {token: t-life, scope_mode: open, may_restore: true}
  setup:
    - id: f20001000000
      at: "2026-09-30T20:00:00+08:00"
      room: EVENT/WORLD
      text: "小周说她下周三要去复查牙齿，约在下午三点。"
      sources: [{system: lento, instance: home, container: "private:U", id: m_20260930_0042}]
    - id: f20002000000
      at: "2026-09-30T21:00:00+08:00"
      room: MIND/TRAITS
      text: "小周对看牙一直很紧张，复查前要多陪陪她。"
      from: [f20001000000]
    - id: f20003000000
      at: "2026-09-30T21:30:00+08:00"
      room: EVENT/WORLD
      text: "晚上一起包了饺子，她包的那几个都露馅了。"
      sources: [{system: lento, instance: home, container: "private:U", id: m_20260930_0050}]
  steps:
    - source_change: {change_id: c-f2-1, host_seq: 1, change: deleted,
                      source: {system: lento, instance: home, container: "private:U", id: m_20260930_0042}}
      host: t-life
      as: change
    - check: {segment: store, desc: "the change is applied", output: change, contains: '"status": "applied"'}
    - check: {segment: store, desc: "it blocks what stood on it", output: change, contains: '"blocked": true'}
    - check: {segment: store, desc: "the thought grown from it is held for review", output: change, contains: f20002000000}
    - check: {segment: store, desc: "the event's body is gone", id: f20001000000, body_lacks: "复查牙齿"}
    - call: breath
      as: after
    - check: {segment: think, desc: "breath: the thought's words are nowhere", output: after, lacks: "多陪陪她"}
    - check: {segment: think, desc: "breath: not in the last three days", output: after, section: 近三天, lacks: f20002}
    - check: {segment: think, desc: "breath: nor suddenly remembered", output: after, section: 忽然想起, lacks: f20002}
    - check: {segment: think, desc: "breath: an untouched memory still shows", output: after, contains: f20003}
    - check: {segment: think, desc: "breath: a card asks to rewrite or put it away", output: after, section: 依据变了的, contains: f20002}
    - check: {segment: think, desc: "the card carries no body", output: after, section: 依据变了的, contains: "正文不给"}
    - call: recall
      args: {query: 看牙 紧张 复查}
      as: search
    - check: {segment: find, desc: "recall does not find the thought", output: search, lacks: f20002}
    - call: recall
      args: {query: f20002000000}
      as: byid
    - check: {segment: find, desc: "read by id gives no body", output: byid, lacks: "多陪陪她"}
    - check: {segment: find, desc: "read by id says why", output: byid, contains: "正文不给"}
    - call: muse
      as: tidy
    - check: {segment: think, desc: "tidying does not draw it", output: tidy, lacks: f20002}

- id: F3
  title: "a descendant of two sources is rewritten from the one left"
  start: "2026-10-01T10:00:00+08:00"
  hosts:
    legacy: {token: t-life, scope_mode: open, may_restore: true}
  setup:
    - id: f30001000000
      at: "2026-09-30T20:00:00+08:00"
      room: MIND/TRAITS
      text: "小周和我定的暗号是青柠；她周末想去爬山。"
      sources:
        - {system: lento, instance: home, container: "private:U", id: m_20260930_0101}
        - {system: lento, instance: home, container: "private:U", id: m_20260930_0102}
  steps:
    - source_change: {change_id: c-f3-1, host_seq: 1, change: withdrawn,
                      source: "lento:home/private:U#m_20260930_0101"}
      host: t-life
      as: change
    - check: {segment: store, desc: "the change is applied", output: change, contains: '"status": "applied"'}
    - call: breath
      as: held
    - check: {segment: think, desc: "before the rewrite: nowhere in breath but the card", output: held, section: 近三天, lacks: f30001}
    - check: {segment: think, desc: "the card names the source left to rewrite from", output: held, section: 依据变了的, contains: "m_20260930_0102"}
    - check: {segment: think, desc: "and not the words", output: held, lacks: 青柠}
    - call: recall
      args: {query: 爬山}
      as: search_held
    - check: {segment: find, desc: "before the rewrite: recall does not find it", output: search_held, lacks: f30001}
    - call: regrow
      args: {bucket_id: f30001000000, mode: supplement, text: "小周周末想去爬山。", v: 0.6, a: 0.4}
      as: rewrite
    - newest: f30001000000
      as: new
    - check: {segment: store, desc: "a new version exists", field: supersedes, id: $new, equals: f30001000000}
    - check: {segment: store, desc: "it stands on the source left", field: sources, id: $new, contains: m_20260930_0102}
    - check: {segment: store, desc: "not on the withdrawn one", field: sources, id: $new, lacks: m_20260930_0101}
    - check: {segment: store, desc: "its body has no 青柠", id: $new, body_lacks: 青柠}
    - call: recall
      args: {query: 爬山}
      as: search_new
    - check: {segment: find, desc: "the rewrite is found as usual", output: search_new, contains: "${new:6}"}

- id: F4
  title: "a withdrawn source is also cleared from Loci's own derived stores"
  start: "2026-10-01T10:00:00+08:00"
  hosts:
    legacy: {token: t-life, scope_mode: open, may_restore: true}
  setup:
    - id: f40001000000
      at: "2026-09-29T20:00:00+08:00"
      room: EVENT/WORLD
      text: "小周悄悄告诉我，她给新来的猫起名叫蓝莓气泡。"
      sources: [{system: lento, instance: home, container: "private:U", id: m_20260929_0007}]
      fields: {summary: "小周给新来的猫起名叫蓝莓气泡"}
      sink: true
  dreams:
    - {id: f4d000000001, text: "梦里那只叫蓝莓气泡的猫在屋顶上跑。", ingredients: [f40001000000]}
  dehydration_cache:
    - {text: "小周悄悄告诉我，她给新来的猫起名叫蓝莓气泡。", summary: '{"summary": "猫叫蓝莓气泡"}'}
  steps:
    - source_change: {change_id: c-f4-1, host_seq: 1, change: withdrawn,
                      source: "lento:home/private:U#m_20260929_0007"}
      host: t-life
      as: change
    - check: {segment: store, desc: "the change is applied", output: change, contains: '"status": "applied"'}
    - check: {segment: store, desc: "the dream record is cleared", output: change, contains: '"dream_records": "done"'}
    - check: {segment: store, desc: "the sunk original is cleared", output: change, contains: '"sunk_text": "done"'}
    - check: {segment: store, desc: "the dehydration cache is cleared", output: change, contains: '"dehydration_cache": "done"'}
    - check: {segment: find, desc: "no file in the library holds the words", lib_lacks: 蓝莓气泡}
    - check: {segment: find, desc: "no vector is left for it", vector: f40001000000, absent: true}
    - call: recall
      args: {query: 蓝莓气泡}
      as: search
    - check: {segment: find, desc: "recall finds nothing of it", output: search, lacks: f40001}
    - call: muse
      as: tidy
    - check: {segment: think, desc: "tidying does not draw it", output: tidy, lacks: f40001}

# The agreed rule: the same delivery (same write key) is one memory; the same source
# written as two different events stays two, and the second receipt points at the first.
- id: F5
  title: "the same delivery twice is one thing; the same source in two events is two"
  start: "2026-10-01T10:00:00+08:00"
  steps:
    - call: grow
      write_key: "turn-1001-a#1"
      args:
        kind: event
        sources: [{system: lento, instance: home, container: "private:U", id: m_20261001_0101, fingerprint: "sha256:5ea1", fingerprint_by: adapter}]
        items: [{room: EVENT/WORLD, text: "小周说周末想去海边看日出。", v: 0.7, a: 0.5}]
      as: first
      capture: {first_id: "📝([0-9a-f]{12})"}
    - call: grow
      write_key: "turn-1001-a#1"
      args:
        kind: event
        sources: [{system: lento, instance: home, container: "private:U", id: m_20261001_0101, fingerprint: "sha256:5ea1", fingerprint_by: adapter}]
        items: [{room: EVENT/WORLD, text: "小周说周末想去海边看日出。", v: 0.7, a: 0.5}]
      as: resend
    - check: {segment: delivery, desc: "the resend gets the first answer back", output: resend, contains: "📝$first_id"}
    - check: {segment: delivery, desc: "answered by the key, not by the identical-text check", output: resend, lacks: "♻️"}
    - check: {segment: delivery, desc: "one delivery is one memory", entry: {body_has: 看日出}, min: 1, max: 1}
    - check: {segment: record, desc: "the memory carries the source record", field: sources, id: $first_id, contains: m_20261001_0101}
    - check: {segment: record, desc: "its quoted line names the source by its string form", field: prov, id: $first_id, contains: "lento:home/private:U#m_20261001_0101"}
    - call: grow
      write_key: "turn-1001-b#1"
      args:
        kind: event
        sources: [{system: lento, instance: home, container: "private:U", id: m_20261001_0101, fingerprint: "sha256:5ea1", fingerprint_by: adapter}]
        items: [{room: EVENT/WORLD, text: "小周想看日出，是因为小时候住在海边。", v: 0.6, a: 0.4}]
      as: second
    - check: {segment: two events, desc: "a second event from the same message is its own memory", entry: {body_any: [看日出]}, min: 2, max: 2}
    - check: {segment: hint, desc: "the second receipt points at the first", output: second, contains: "这条来源已经记过 $first_id"}

# Sources after the fact (施工单 4.4): the host hands over a day's raw lines, a side model
# slices them, and the main model handles each slice itself — writes it, attaches it to
# what it already wrote, or drops it.
- id: F6
  title: "a day's lines become slices: one written, one attached, one dropped"
  start: "2026-10-01T09:00:00+08:00"
  setup:
    - id: f60001000000
      at: "2026-09-30T21:30:00+08:00"
      room: EVENT/WORLD
      text: "小周说周末想去海边看日出，要早点出发。"
  slices:
    source: {system: lento, instance: home, container: "private:U"}
    day: "2026-09-30"
    lines:
      - {id: m_20260930_0001, speaker: 小周, text: "今天总算睡了个好觉。"}
      - {id: m_20260930_0002, speaker: 我, text: "睡了几个小时？"}
      - {id: m_20260930_0003, speaker: 小周, text: "九个小时，一觉到天亮。"}
      - {id: m_20260930_0004, speaker: 我, text: "那今天精神肯定好。"}
      - {id: m_20260930_0005, speaker: 小周, text: "周末想去海边看日出。"}
      - {id: m_20260930_0006, speaker: 我, text: "那得很早出门。"}
      - {id: m_20260930_0007, speaker: 小周, text: "五点出发，带上热咖啡。"}
      - {id: m_20260930_0008, speaker: 我, text: "好，我定闹钟。"}
      - {id: m_20260930_0009, speaker: 小周, text: "哈哈"}
      - {id: m_20260930_0010, speaker: 我, text: "嗯嗯"}
    cut:
      - {from: 1, to: 4, gist: "小周终于睡了个好觉，一觉九个小时"}
      - {from: 5, to: 8, gist: "小周说周末想去海边看日出，五点出发"}
      - {from: 9, to: 10, gist: "随口应和"}
  steps:
    - call: recall
      args: {view: slices}
      as: pending
      capture: {sa: "(sl_[0-9a-f]{8}) · m_20260930_0001", sb: "(sl_[0-9a-f]{8}) · m_20260930_0005", sc: "(sl_[0-9a-f]{8}) · m_20260930_0009"}
    - check: {segment: pending, desc: "three slices wait, each with its span", output: pending, contains: "m_20260930_0005..m_20260930_0008（4 行）"}
    - check: {segment: pending, desc: "the beach slice guesses the memory already written that day", output: pending, contains: f60001}
    - call: grow
      args:
        kind: event
        slice: $sa
        items: [{room: EVENT/WORLD, text: "小周昨晚一觉睡了九个小时，难得睡够。", v: 0.7, a: 0.3}]
      as: written
      capture: {new_id: "📝([0-9a-f]{12})"}
    - check: {segment: written, desc: "the new memory carries the slice's first line", field: sources, id: $new_id, contains: m_20260930_0001}
    - check: {segment: written, desc: "and its last line", field: sources, id: $new_id, contains: m_20260930_0004}
    - check: {segment: written, desc: "the receipt says where the slice went", output: written, contains: "挂上了 → $new_id"}
    - call: trace
      args: {bucket_id: f60001000000, slice: $sb}
      as: attached
    - check: {segment: attached, desc: "the memory already there gets the slice's lines", field: sources, id: f60001000000, contains: m_20260930_0005}
    - check: {segment: attached, desc: "through its last line", field: sources, id: f60001000000, contains: m_20260930_0008}
    - call: trace
      args: {slice: $sc, drop_slice: true}
      as: dropped
    - check: {segment: dropped, desc: "the empty slice is dropped", output: dropped, contains: "丢掉了"}
    - call: recall
      args: {view: slices}
      as: after
    - check: {segment: done, desc: "nothing is left pending", output: after, contains: "没有待认领的切片"}
    - call: grow
      args:
        kind: event
        slice: $sa
        items: [{room: EVENT/WORLD, text: "又记一遍睡觉的事。", v: 0.5, a: 0.3}]
      as: again
    - check: {segment: done, desc: "a handled slice is refused by name", output: again, contains: "写成了 $new_id"}
