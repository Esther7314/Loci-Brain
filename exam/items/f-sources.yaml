# Paper section 己: archiving is light, deleting a source is heavy.
- id: F1
  title: "archiving a source leaves its descendants as they were"
  start: "2026-10-01T10:00:00+08:00"
  setup:
    - id: f10001000000
      at: "2026-09-27T20:00:00+08:00"
      room: EVENT/SELF
      text: "周六和她去爬山，她一路都在笑。"
    - id: f10002000000
      at: "2026-09-28T09:00:00+08:00"
      room: MIND/TRAITS
      text: "她累的时候反而想出门。"
      from: [f10001000000]
  steps:
    - call: trace
      args: {bucket_id: f10001000000, delete: true}
    - check: {segment: store, desc: "the source went to the archive", field: _path, id: f10001000000, contains: archive}
    - call: recall
      args: {query: 出门}
    - check: {segment: find, desc: "the descendant is still found", output: recall, contains: f10002}
    - call: recall
      args: {query: f10002000000}
      as: child
    - check: {segment: source, desc: "the descendant can still reach its source", output: child, contains: f10001}

- id: F2
  title: "a deleted source stops its descendants on every road"
  interface: none
  needs: "the route that carries the signal to the registry (POST /api/v2/source/change; apply_change itself is in); descendants withheld in breath, recall, read by id, dream and tidy material, cards"

- id: F3
  title: "a descendant of two sources is rewritten from the one left"
  interface: none
  needs: "the signal's route (F2) and withholding until rewritten; sources carrying 'where + id' and regrow leaving a withdrawn source behind are in"

- id: F4
  title: "a withdrawn source is also cleared from Loci's own derived stores"
  interface: none
  needs: "the signal's route (F2) with cleanup steps after apply_change reaching embeddings.db, the BM25 index, dream records (night_fall/dreams) and sunk bodies (archive/原文)"

# The agreed rule: the same delivery (same write key) is one memory; the same source
# written as two different events stays two, and the second receipt points at the first.
- id: F5
  title: "the same delivery twice is one thing; the same source in two events is two"
  start: "2026-10-01T10:00:00+08:00"
  steps:
    - call: grow
      write_key: "turn-1001-a#1"
      args:
        kind: event
        sources: [{system: lento, instance: home, container: "private:U", id: m_20261001_0101, fingerprint: "sha256:5ea1", fingerprint_by: adapter}]
        items: [{room: EVENT/WORLD, text: "小周说周末想去海边看日出。", v: 0.7, a: 0.5}]
      as: first
      capture: {first_id: "📝([0-9a-f]{12})"}
    - call: grow
      write_key: "turn-1001-a#1"
      args:
        kind: event
        sources: [{system: lento, instance: home, container: "private:U", id: m_20261001_0101, fingerprint: "sha256:5ea1", fingerprint_by: adapter}]
        items: [{room: EVENT/WORLD, text: "小周说周末想去海边看日出。", v: 0.7, a: 0.5}]
      as: resend
    - check: {segment: delivery, desc: "the resend gets the first answer back", output: resend, contains: "📝$first_id"}
    - check: {segment: delivery, desc: "answered by the key, not by the identical-text check", output: resend, lacks: "♻️"}
    - check: {segment: delivery, desc: "one delivery is one memory", entry: {body_has: 看日出}, min: 1, max: 1}
    - check: {segment: record, desc: "the memory carries the source record", field: sources, id: $first_id, contains: m_20261001_0101}
    - check: {segment: record, desc: "its quoted line names the source by its string form", field: prov, id: $first_id, contains: "lento:home/private:U#m_20261001_0101"}
    - call: grow
      write_key: "turn-1001-b#1"
      args:
        kind: event
        sources: [{system: lento, instance: home, container: "private:U", id: m_20261001_0101, fingerprint: "sha256:5ea1", fingerprint_by: adapter}]
        items: [{room: EVENT/WORLD, text: "小周想看日出，是因为小时候住在海边。", v: 0.6, a: 0.4}]
      as: second
    - check: {segment: two events, desc: "a second event from the same message is its own memory", entry: {body_any: [看日出]}, min: 2, max: 2}
    - check: {segment: hint, desc: "the second receipt points at the first", output: second, contains: "这条来源已经记过 $first_id"}

# Sources after the fact (施工单 4.4): the host hands over a day's raw lines, a side model
# slices them, and the main model handles each slice itself — writes it, attaches it to
# what it already wrote, or drops it.
- id: F6
  title: "a day's lines become slices: one written, one attached, one dropped"
  start: "2026-10-01T09:00:00+08:00"
  setup:
    - id: f60001000000
      at: "2026-09-30T21:30:00+08:00"
      room: EVENT/WORLD
      text: "小周说周末想去海边看日出，要早点出发。"
  slices:
    source: {system: lento, instance: home, container: "private:U"}
    day: "2026-09-30"
    lines:
      - {id: m_20260930_0001, speaker: 小周, text: "今天总算睡了个好觉。"}
      - {id: m_20260930_0002, speaker: 我, text: "睡了几个小时？"}
      - {id: m_20260930_0003, speaker: 小周, text: "九个小时，一觉到天亮。"}
      - {id: m_20260930_0004, speaker: 我, text: "那今天精神肯定好。"}
      - {id: m_20260930_0005, speaker: 小周, text: "周末想去海边看日出。"}
      - {id: m_20260930_0006, speaker: 我, text: "那得很早出门。"}
      - {id: m_20260930_0007, speaker: 小周, text: "五点出发，带上热咖啡。"}
      - {id: m_20260930_0008, speaker: 我, text: "好，我定闹钟。"}
      - {id: m_20260930_0009, speaker: 小周, text: "哈哈"}
      - {id: m_20260930_0010, speaker: 我, text: "嗯嗯"}
    cut:
      - {from: 1, to: 4, gist: "小周终于睡了个好觉，一觉九个小时"}
      - {from: 5, to: 8, gist: "小周说周末想去海边看日出，五点出发"}
      - {from: 9, to: 10, gist: "随口应和"}
  steps:
    - call: recall
      args: {view: slices}
      as: pending
      capture: {sa: "(sl_[0-9a-f]{8}) · m_20260930_0001", sb: "(sl_[0-9a-f]{8}) · m_20260930_0005", sc: "(sl_[0-9a-f]{8}) · m_20260930_0009"}
    - check: {segment: pending, desc: "three slices wait, each with its span", output: pending, contains: "m_20260930_0005..m_20260930_0008（4 行）"}
    - check: {segment: pending, desc: "the beach slice guesses the memory already written that day", output: pending, contains: f60001}
    - call: grow
      args:
        kind: event
        slice: $sa
        items: [{room: EVENT/WORLD, text: "小周昨晚一觉睡了九个小时，难得睡够。", v: 0.7, a: 0.3}]
      as: written
      capture: {new_id: "📝([0-9a-f]{12})"}
    - check: {segment: written, desc: "the new memory carries the slice's first line", field: sources, id: $new_id, contains: m_20260930_0001}
    - check: {segment: written, desc: "and its last line", field: sources, id: $new_id, contains: m_20260930_0004}
    - check: {segment: written, desc: "the receipt says where the slice went", output: written, contains: "挂上了 → $new_id"}
    - call: trace
      args: {bucket_id: f60001000000, slice: $sb}
      as: attached
    - check: {segment: attached, desc: "the memory already there gets the slice's lines", field: sources, id: f60001000000, contains: m_20260930_0005}
    - check: {segment: attached, desc: "through its last line", field: sources, id: f60001000000, contains: m_20260930_0008}
    - call: trace
      args: {slice: $sc, drop_slice: true}
      as: dropped
    - check: {segment: dropped, desc: "the empty slice is dropped", output: dropped, contains: "丢掉了"}
    - call: recall
      args: {view: slices}
      as: after
    - check: {segment: done, desc: "nothing is left pending", output: after, contains: "没有待认领的切片"}
    - call: grow
      args:
        kind: event
        slice: $sa
        items: [{room: EVENT/WORLD, text: "又记一遍睡觉的事。", v: 0.5, a: 0.3}]
      as: again
    - check: {segment: done, desc: "a handled slice is refused by name", output: again, contains: "写成了 $new_id"}
